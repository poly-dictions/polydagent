<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>research - polydictions</title>
    <link rel="icon" type="image/png" href="../images/1.png">
    <link href="../stylesheet_0.css" rel="stylesheet">
    <link href="../css/app.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fb651e;
            color: white;
            min-height: 100vh;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .hero p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            text-transform: lowercase;
            margin-bottom: 24px;
        }

        /* Chat Container */
        .chat-container {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin: 0 auto;
            max-width: 800px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* Messages Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 350px;
            max-height: 500px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #fb651e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: #f5f5f5;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.assistant .market-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .market-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .market-title {
            font-weight: 600;
            font-size: 15px;
            color: #1a1a1a;
            flex: 1;
        }

        .market-volume {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 8px;
            white-space: nowrap;
            margin-left: 12px;
        }

        .market-outcomes {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .outcome-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .outcome-name {
            font-size: 14px;
            color: #333;
        }

        .outcome-price {
            font-weight: 600;
            font-size: 14px;
        }

        .outcome-price.yes {
            color: #22c55e;
        }

        .outcome-price.no {
            color: #ef4444;
        }

        .market-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e5e5;
            font-size: 12px;
            color: #666;
        }

        .market-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .analysis-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #ddd;
        }

        .analysis-title {
            font-weight: 600;
            font-size: 14px;
            color: #fb651e;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .analysis-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .analysis-content ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .analysis-content li {
            margin: 4px 0;
        }

        .risk-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .risk-low {
            background: #dcfce7;
            color: #166534;
        }

        .risk-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .risk-high {
            background: #fee2e2;
            color: #991b1b;
        }

        /* AI Context Button */
        .ai-context-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #ddd;
        }

        .ai-context-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .ai-context-title {
            font-weight: 600;
            font-size: 14px;
            color: #fb651e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-context-btn {
            padding: 8px 16px;
            background: #fb651e;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ai-context-btn:hover:not(:disabled) {
            background: #e55a1a;
            transform: scale(1.02);
        }

        .ai-context-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .ai-context-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .ai-context-content ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .ai-context-content li {
            margin: 4px 0;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid #e5e5e5;
            margin-top: auto;
        }

        .chat-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            color: #1a1a1a;
        }

        .chat-input:focus {
            border-color: #fb651e;
        }

        .chat-input::placeholder {
            color: #999;
        }

        .send-btn {
            padding: 16px 24px;
            background: #fb651e;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover {
            background: #e55a1a;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Placeholder message */
        .placeholder-msg {
            text-align: center;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .placeholder-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #fb651e 0%, #ff8a50 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .placeholder-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .placeholder-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .placeholder-msg .hint {
            color: #999;
            font-size: 14px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            background: #f5f5f5;
            border-radius: 16px;
            align-self: flex-start;
            color: #666;
            font-size: 14px;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #fb651e;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Quick actions */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .quick-action {
            padding: 8px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-action:hover {
            background: #fb651e;
            color: white;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .chat-container {
                margin: 0 16px;
                padding: 16px;
            }

            .messages {
                min-height: 300px;
            }

            .input-area {
                flex-direction: column;
            }

            .send-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

    <!-- Chat Container -->
    <div class="container">
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="placeholder-msg">
                    <div class="placeholder-title">ask anything about prediction markets</div>
                    <div class="hint">paste a polymarket or kalshi url, or ask a question</div>
                </div>
            </div>

            <div class="quick-actions" id="quickActions">
                <button class="quick-action" onclick="askQuestion('what are the top trending markets right now?')">trending markets</button>
                <button class="quick-action" onclick="askQuestion('what are the top AI and tech prediction markets?')">AI & tech</button>
                <button class="quick-action" onclick="askQuestion('which crypto markets have the best opportunities?')">crypto opportunities</button>
                <button class="quick-action" onclick="askQuestion('what markets are mispriced right now?')">find mispriced</button>
            </div>

            <div class="input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="paste polymarket/kalshi url or ask a question..." autocomplete="off">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <span>send</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8765'
            : 'https://polydictions-production.up.railway.app';

        const messagesContainer = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickActions = document.getElementById('quickActions');

        let isProcessing = false;
        let contextCounter = 0;

        // Enter key handler
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });

        function askQuestion(question) {
            chatInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = chatInput.value.trim();
            if (!input || isProcessing) return;

            // Hide placeholder and quick actions
            const placeholder = document.querySelector('.placeholder-msg');
            if (placeholder) placeholder.remove();
            quickActions.style.display = 'none';

            // Add user message
            addMessage(input, 'user');
            chatInput.value = '';

            // Show loading
            isProcessing = true;
            sendBtn.disabled = true;
            const loadingEl = showLoading();

            try {
                // Check if it's a polymarket URL
                const polymarketMatch = input.match(/polymarket\.com\/event\/([^\/\s?]+)/);
                // Check if it's a kalshi URL - extract the LAST part (market ticker)
                // URL format: kalshi.com/markets/{series}/{event-slug}/{market-ticker}
                const kalshiMatch = input.match(/kalshi\.com\/markets\/(.+)/i);

                if (polymarketMatch) {
                    // Fetch event data
                    const eventSlug = polymarketMatch[1];
                    await analyzeEvent(eventSlug, loadingEl);
                } else if (kalshiMatch) {
                    // Extract ticker - last part of the path
                    const pathParts = kalshiMatch[1].split('/').filter(p => p && !p.includes('?'));
                    const ticker = pathParts[pathParts.length - 1] || pathParts[0];
                    await analyzeKalshiMarket(ticker, loadingEl);
                } else {
                    // General question - use AI
                    await answerQuestion(input, loadingEl);
                }
            } catch (error) {
                console.error('Error:', error);
                loadingEl.remove();
                addMessage('sorry, something went wrong. please try again.', 'assistant');
            }

            isProcessing = false;
            sendBtn.disabled = false;
        }

        async function analyzeEvent(eventSlug, loadingEl) {
            try {
                // Fetch event via our backend (to avoid CORS)
                const resp = await fetch(`${API_URL}/api/research/event/${eventSlug}`);

                if (!resp.ok) {
                    loadingEl.remove();
                    addMessage('could not find that event. please check the url and try again.', 'assistant');
                    return;
                }

                const data = await resp.json();

                if (!data.event) {
                    loadingEl.remove();
                    addMessage('could not find that event. please check the url and try again.', 'assistant');
                    return;
                }

                loadingEl.remove();
                addEventAnalysis(data.event, data.analysis);

            } catch (error) {
                console.error('Event analysis error:', error);
                loadingEl.remove();
                addMessage('failed to analyze event. please try again.', 'assistant');
            }
        }

        async function analyzeKalshiMarket(ticker, loadingEl) {
            try {
                // Fetch Kalshi market via our backend
                const resp = await fetch(`${API_URL}/api/research/kalshi/${ticker}`);

                if (!resp.ok) {
                    loadingEl.remove();
                    addMessage('could not find that kalshi market. please check the url and try again.', 'assistant');
                    return;
                }

                const data = await resp.json();

                if (!data.market) {
                    loadingEl.remove();
                    addMessage('could not find that kalshi market. please check the url and try again.', 'assistant');
                    return;
                }

                loadingEl.remove();
                addKalshiAnalysis(data.market, data.analysis);

            } catch (error) {
                console.error('Kalshi analysis error:', error);
                loadingEl.remove();
                addMessage('failed to analyze kalshi market. please try again.', 'assistant');
            }
        }

        async function answerQuestion(question, loadingEl) {
            try {
                const resp = await fetch(`${API_URL}/api/research/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                loadingEl.remove();

                if (resp.ok) {
                    const data = await resp.json();

                    if (data.markets && data.markets.length > 0) {
                        // Show markets with analysis
                        addMarketsResponse(data.markets, data.analysis);
                    } else if (data.answer) {
                        addMessage(data.answer, 'assistant');
                    } else {
                        addMessage('i couldn\'t find relevant information for that question. try asking about specific markets or events.', 'assistant');
                    }
                } else {
                    addMessage('sorry, i couldn\'t process that question. try pasting a polymarket url instead.', 'assistant');
                }
            } catch (error) {
                console.error('Question error:', error);
                loadingEl.remove();
                addMessage('connection error. please try again.', 'assistant');
            }
        }

        function addMessage(content, type) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${type}`;
            msgEl.textContent = content;
            messagesContainer.appendChild(msgEl);
            scrollToBottom();
        }

        function addEventAnalysis(event, analysis) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message assistant';

            const markets = event.markets || [];
            const totalVolume = markets.reduce((sum, m) => sum + parseFloat(m.volume || 0), 0);
            const totalLiquidity = markets.reduce((sum, m) => sum + parseFloat(m.liquidity || 0), 0);

            let html = `<strong>${event.title}</strong>`;

            // Show markets
            markets.slice(0, 3).forEach(market => {
                const outcomes = market.outcomes ? JSON.parse(market.outcomes) : ['Yes', 'No'];
                const prices = market.outcomePrices ? JSON.parse(market.outcomePrices) : [0.5, 0.5];

                html += `
                    <div class="market-card">
                        <div class="market-card-header">
                            <div class="market-title">${market.question || market.groupItemTitle || 'Market'}</div>
                            <div class="market-volume">$${formatNumber(market.volume)} vol</div>
                        </div>
                        <div class="market-outcomes">
                            ${outcomes.map((outcome, i) => `
                                <div class="outcome-row">
                                    <span class="outcome-name">${outcome}</span>
                                    <span class="outcome-price ${i === 0 ? 'yes' : 'no'}">${(parseFloat(prices[i]) * 100).toFixed(1)}%</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="market-stats">
                            <div class="market-stat">liquidity: $${formatNumber(market.liquidity)}</div>
                            <div class="market-stat">24h: ${market.volume24hr ? '$' + formatNumber(market.volume24hr) : 'n/a'}</div>
                        </div>
                    </div>
                `;
            });

            // Show analysis
            if (analysis) {
                html += `
                    <div class="analysis-section">
                        <div class="analysis-title">analysis</div>
                        <div class="analysis-content">${formatAnalysis(analysis)}</div>
                    </div>
                `;
            }

            // Summary stats
            html += `
                <div class="market-stats" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e5e5;">
                    <div class="market-stat">total volume: $${formatNumber(totalVolume)}</div>
                    <div class="market-stat">total liquidity: $${formatNumber(totalLiquidity)}</div>
                    <div class="market-stat">${markets.length} market${markets.length !== 1 ? 's' : ''}</div>
                </div>
            `;

            // AI Context section
            const ctxId = contextCounter++;
            html += `
                <div class="ai-context-section">
                    <div class="ai-context-header">
                        <div class="ai-context-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5A2.5 2.5 0 0 0 7.5 18a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5a2.5 2.5 0 0 0 2.5 2.5a2.5 2.5 0 0 0 2.5-2.5a2.5 2.5 0 0 0-2.5-2.5z"/></svg>
                            ai context
                        </div>
                        <button class="ai-context-btn" id="ctxBtn${ctxId}" onclick="generatePolymarketContext('${event.slug}', ${ctxId})">
                            get insights
                        </button>
                    </div>
                    <div class="ai-context-content" id="ctxContent${ctxId}"></div>
                </div>
            `;

            msgEl.innerHTML = html;
            messagesContainer.appendChild(msgEl);
            scrollToBottom();
        }

        function addKalshiAnalysis(market, analysis) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message assistant';

            const yesPrice = market.yes_price !== undefined ? market.yes_price : (market.last_price || 50);
            const noPrice = 100 - yesPrice;
            const volume = market.volume || 0;

            let html = `<strong>${market.title || market.market_ticker}</strong>`;

            html += `
                <div class="market-card">
                    <div class="market-card-header">
                        <div class="market-title">${market.title || market.market_ticker}</div>
                        <div class="market-volume">$${formatNumber(volume)} vol</div>
                    </div>
                    <div class="market-outcomes">
                        <div class="outcome-row">
                            <span class="outcome-name">Yes</span>
                            <span class="outcome-price yes">${yesPrice.toFixed(1)}%</span>
                        </div>
                        <div class="outcome-row">
                            <span class="outcome-name">No</span>
                            <span class="outcome-price no">${noPrice.toFixed(1)}%</span>
                        </div>
                    </div>
                    <div class="market-stats">
                        <div class="market-stat">ticker: ${market.market_ticker || market.event_ticker || 'N/A'}</div>
                        <div class="market-stat">status: ${market.status || 'open'}</div>
                        ${market.close_time ? `<div class="market-stat">closes: ${new Date(market.close_time * 1000).toLocaleDateString()}</div>` : ''}
                    </div>
                </div>
            `;

            // Show analysis
            if (analysis) {
                html += `
                    <div class="analysis-section">
                        <div class="analysis-title">analysis</div>
                        <div class="analysis-content">${formatAnalysis(analysis)}</div>
                    </div>
                `;
            }

            // Link to Kalshi
            html += `
                <div style="margin-top: 12px;">
                    <a href="https://kalshi.com/markets/${(market.event_ticker || market.market_ticker || '').toLowerCase()}" target="_blank" rel="noopener" style="color: #fb651e; font-size: 13px; text-decoration: none;">View on Kalshi →</a>
                </div>
            `;

            // AI Context section for Kalshi
            const ctxId = contextCounter++;
            const ticker = market.market_ticker || market.event_ticker || '';
            const title = market.title || ticker;
            html += `
                <div class="ai-context-section">
                    <div class="ai-context-header">
                        <div class="ai-context-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5A2.5 2.5 0 0 0 7.5 18a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5a2.5 2.5 0 0 0 2.5 2.5a2.5 2.5 0 0 0 2.5-2.5a2.5 2.5 0 0 0-2.5-2.5z"/></svg>
                            ai context
                        </div>
                        <button class="ai-context-btn" id="ctxBtn${ctxId}" onclick="generateKalshiContext('${encodeURIComponent(title)}', '${ticker}', ${ctxId})">
                            get insights
                        </button>
                    </div>
                    <div class="ai-context-content" id="ctxContent${ctxId}"></div>
                </div>
            `;

            msgEl.innerHTML = html;
            messagesContainer.appendChild(msgEl);
            scrollToBottom();
        }

        function addMarketsResponse(markets, analysis) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message assistant';

            let html = '';

            // Show markets
            markets.slice(0, 5).forEach(market => {
                const outcomes = market.outcomes || ['Yes', 'No'];
                const prices = market.prices || [0.5, 0.5];

                html += `
                    <div class="market-card">
                        <div class="market-card-header">
                            <div class="market-title">${market.question || market.title}</div>
                            <div class="market-volume">$${formatNumber(market.volume)} vol</div>
                        </div>
                        <div class="market-outcomes">
                            ${outcomes.slice(0, 4).map((outcome, i) => `
                                <div class="outcome-row">
                                    <span class="outcome-name">${outcome}</span>
                                    <span class="outcome-price ${i === 0 ? 'yes' : ''}">${(parseFloat(prices[i] || 0) * 100).toFixed(1)}%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            // Show analysis
            if (analysis) {
                html += `
                    <div class="analysis-section">
                        <div class="analysis-title">analysis</div>
                        <div class="analysis-content">${formatAnalysis(analysis)}</div>
                    </div>
                `;
            }

            msgEl.innerHTML = html;
            messagesContainer.appendChild(msgEl);
            scrollToBottom();
        }

        function formatAnalysis(text) {
            // Convert markdown-like formatting
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/- (.*?)(?=<br>|$)/g, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>')
                .replace(/<\/ul><ul>/g, '');
        }

        function showLoading() {
            const loadingEl = document.createElement('div');
            loadingEl.className = 'loading';
            loadingEl.innerHTML = `
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span>analyzing...</span>
            `;
            messagesContainer.appendChild(loadingEl);
            scrollToBottom();
            return loadingEl;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function formatNumber(num) {
            if (!num) return '0';
            num = parseFloat(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toFixed(0);
        }

        // AI Context generation functions
        async function generatePolymarketContext(slug, ctxId) {
            const contentEl = document.getElementById(`ctxContent${ctxId}`);
            const btnEl = document.getElementById(`ctxBtn${ctxId}`);

            if (!contentEl || !btnEl) return;

            btnEl.disabled = true;
            btnEl.textContent = 'generating...';
            contentEl.innerHTML = '<div style="color: #666; font-size: 13px;">analyzing market data, news & social sentiment...</div>';

            try {
                const response = await fetch(`${API_URL}/api/context?slug=${encodeURIComponent(slug)}`);
                const data = await response.json();

                if (data.success && data.context) {
                    contentEl.innerHTML = data.context;
                    btnEl.textContent = 'refresh';
                } else {
                    throw new Error(data.error || 'Failed to generate');
                }
            } catch (error) {
                console.error('Context error:', error);
                contentEl.innerHTML = `<span style="color: #ef4444;">failed: ${error.message}</span>`;
                btnEl.textContent = 'retry';
            } finally {
                btnEl.disabled = false;
            }
        }

        async function generateKalshiContext(encodedTitle, ticker, ctxId) {
            const title = decodeURIComponent(encodedTitle);
            const contentEl = document.getElementById(`ctxContent${ctxId}`);
            const btnEl = document.getElementById(`ctxBtn${ctxId}`);

            if (!contentEl || !btnEl) return;

            btnEl.disabled = true;
            btnEl.textContent = 'generating...';
            contentEl.innerHTML = '<div style="color: #666; font-size: 13px;">analyzing market data, news & social sentiment...</div>';

            try {
                const response = await fetch(`${API_URL}/api/kalshi/context?title=${encodeURIComponent(title)}&ticker=${encodeURIComponent(ticker)}`);
                const data = await response.json();

                if (data.success && data.context) {
                    contentEl.innerHTML = data.context;
                    btnEl.textContent = 'refresh';
                } else {
                    throw new Error(data.error || 'Failed to generate');
                }
            } catch (error) {
                console.error('Context error:', error);
                contentEl.innerHTML = `<span style="color: #ef4444;">failed: ${error.message}</span>`;
                btnEl.textContent = 'retry';
            } finally {
                btnEl.disabled = false;
            }
        }
    </script>
</body>
</html>
